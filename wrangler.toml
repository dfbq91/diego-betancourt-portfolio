#:schema node_modules/wrangler/config-schema.json
name = "diego-betancourt-portfolio"
compatibility_date = "2026-09-01"
# NOTE: no `pages_build_output_dir` here — it makes Wrangler validate every
# config (including the adapter's internal prerender worker) as a Pages project,
# which rejects the ASSETS binding the adapter generates. Deployment bindings
# are configured in the Cloudflare Pages dashboard (see task T22).

# Workers AI binding — used by /api/chat for embeddings and text generation (RNF-7).
# No API keys are exposed; access is exclusively through this binding.
[ai]
binding = "AI"

# KV namespace for chat rate limiting (RF-18).
# Replace `id` with the real namespace ID from your Cloudflare account:
#   npx wrangler kv namespace create CHAT_RATE_LIMIT
[[kv_namespaces]]
binding = "CHAT_RATE_LIMIT"
id = "036038ffe49248d59d08b35b2492df0e"

# Non-secret runtime configuration for /api/chat.
[vars]
RAG_SESSION_QUESTION_LIMIT = "10"
RAG_TOP_K = "3"
WORKERS_AI_EMBEDDING_MODEL = "@cf/baai/bge-m3"
WORKERS_AI_GENERATION_MODEL = "@cf/zai-org/glm-4.7-flash"
